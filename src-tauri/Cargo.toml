[package]
name = "musicplayer23"
version = "1.0.0"
description = "Cross-platform music and video player"
authors = ["Music Player"]
edition = "2021"

[lib]
name = "musicplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"

# rodio + symphonia decodes audio in Rust, so playback does not depend on the
# codecs shipped by each platform's webview (mp3, flac, wav, ogg, m4a/alac,
# aac, aiff, caf and more).
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }

# Tag reading for titles, artists, albums, durations and embedded cover art.
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
